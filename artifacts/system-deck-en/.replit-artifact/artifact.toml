kind = "slides"
previewPath = "/system-deck-en/"
title = "ZACOD ERP Technical Deck (English)"
version = "1.0.0"
id = "artifacts/system-deck-en"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/system-deck-en/" ]
localPort = 20636

[services.development]
run = "pnpm --filter @workspace/system-deck-en run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/system-deck-en", "run", "build" ]
publicDir = "artifacts/system-deck-en/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20636"
BASE_PATH = "/system-deck-en/"
