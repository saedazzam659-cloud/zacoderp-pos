kind = "mobile"
previewPath = "/mobile/"
title = "زاكود ERP موبايل"
description = "تطبيق موبايل (اندرويد و iOS) مكمل لنظام زاكود ERP السحابي: تسجيل دخول بكود الشركة، موديول المبيعات كامل (فواتير ضريبية ومبسطة، أصناف مع قراءة الباركود بالكاميرا، عملاء، سندات قبض) مربوط على نفس API النظام بنفس الصلاحيات والقيود المحاسبية وزاتكا."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
