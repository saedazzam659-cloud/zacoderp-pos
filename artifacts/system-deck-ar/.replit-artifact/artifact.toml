kind = "slides"
previewPath = "/system-deck-ar/"
title = "عرض زاكود ERP التقني (عربي)"
version = "1.0.0"
id = "artifacts/system-deck-ar"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/system-deck-ar/" ]
localPort = 20655

[services.development]
run = "pnpm --filter @workspace/system-deck-ar run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/system-deck-ar", "run", "build" ]
publicDir = "artifacts/system-deck-ar/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20655"
BASE_PATH = "/system-deck-ar/"
