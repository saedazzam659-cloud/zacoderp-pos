kind = "web"
previewPath = "/"
title = "نظام الفاتورة الإلكترونية السعودية"
version = "1.0.0"
id = "artifacts/zatca-invoicing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19225

[services.development]
run = "pnpm --filter @workspace/zatca-invoicing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zatca-invoicing", "run", "build" ]
publicDir = "artifacts/zatca-invoicing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19225"
BASE_PATH = "/"
