<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ZACOD POS — نقاط البيع</title>

    <!-- PWA: installable as a desktop / mobile app -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="نظام نقاط البيع المتكامل — يعمل بدون إنترنت" />

    <!-- iOS / Safari PWA hints -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZACOD POS" />
    <link rel="apple-touch-icon" href="icons/icon-256.png" />

    <!-- Windows tile -->
    <meta name="msapplication-TileColor" content="#2563eb" />
    <meta name="msapplication-TileImage" content="icons/icon-128.png" />

    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="icons/icon-128.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service-worker lifecycle. Hardened so it can NEVER blank the app:
      //   • Tauri shells skip it entirely (native SQLite handles offline).
      //   • In the Replit dev/preview environment we proactively UNREGISTER any
      //     existing SW and clear its caches — a stale SW serving an old app
      //     shell is the classic cause of a recurring blank white screen.
      //   • In production we register using document.baseURI (always an
      //     absolute URL) instead of location.pathname, which was throwing
      //     "Failed to construct 'URL': Invalid base URL" on every load.
      //   • The whole thing is wrapped so a SW failure never breaks first paint.
      (function () {
        try {
          if (!("serviceWorker" in navigator) || window.__TAURI__) return;
          var host = location.hostname;
          var isDevPreview =
            host === "localhost" ||
            host === "127.0.0.1" ||
            host.endsWith(".replit.dev") ||
            host.endsWith(".repl.co") ||
            host.indexOf("picard") !== -1;
          if (isDevPreview) {
            navigator.serviceWorker
              .getRegistrations()
              .then(function (regs) { regs.forEach(function (r) { r.unregister(); }); })
              .catch(function () {});
            if (window.caches && caches.keys) {
              caches.keys()
                .then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); })
                .catch(function () {});
            }
            return;
          }
          window.addEventListener("load", function () {
            try {
              var swUrl = new URL("sw.js", document.baseURI).href;
              navigator.serviceWorker.register(swUrl).catch(function () {
                /* silent — PWA install still works without an active SW */
              });
            } catch (e) {
              /* never let SW setup break the app */
            }
          });
        } catch (e) {
          /* defensive: SW is optional, the app must always boot */
        }
      })();
    </script>
  </body>
</html>
