kind = "web"
previewPath = "/pos-desktop/"
title = "POS Desktop (معاينة المتصفح)"
version = "0.1.0"
id = "artifacts/pos-desktop"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/pos-desktop/" ]
localPort = 24731

[services.development]
run = "pnpm --filter @workspace/pos-desktop run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pos-desktop", "run", "build" ]
publicDir = "artifacts/pos-desktop/dist"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24731"
BASE_PATH = "/pos-desktop/"
