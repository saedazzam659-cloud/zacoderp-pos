[package]
name = "pos-desktop"
version = "0.8.22"
description = "ZACOD POS Desktop (Windows offline)"
edition = "2021"
# Effective MSRV is driven by transitive deps (serde_with 3.21, time 0.3.43,
# time-core/time-macros) which all require rustc 1.88. CI pins the toolchain to
# 1.88.0 — see RUST_VERSION in .github/workflows/pos-desktop-build.yml.
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-http = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-store = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
keyring = "3"
sha2 = "0.10"
hex = "0.4"
sysinfo = "0.31"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
x509-parser = "0.16"
pem = "3"
printers = "2"
serialport = { version = "4", default-features = false }
hostname = "0.4"
dirs = "5"
machine-uid = "0.5"
getrandom = "0.2"
aes-gcm = "0.10"
bcrypt = "0.15"
tiny_http = "0.12"
local-ip-address = "0.6"

# Windows-only: read the uninstall registry to clean up stale side-by-side
# installs of previous versions (see src/cleanup.rs).
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
opt-level = "s"
