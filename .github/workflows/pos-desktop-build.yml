name: pos-desktop / build Windows MSI

# Builds the Tauri Windows POS installer (artifacts/pos-desktop).
#
# Triggers:
#   • push to main / PRs touching pos-desktop  → build + smoke-test, upload MSI as artifact
#   • push tag matching `pos-desktop-v*`        → ALSO sign + create GitHub Release + upload .msi
#   • workflow_dispatch                         → manual run from the Actions tab
#
# This workflow is intentionally self-contained — `artifacts/pos-desktop/` is NOT a pnpm
# workspace package, so we do NOT run any monorepo-wide `pnpm install` here.
# The Tauri sub-project has its own `package.json` and is installed in isolation.

on:
  push:
    branches: [main]
    paths:
      - "artifacts/pos-desktop/**"
      - ".github/workflows/pos-desktop-build.yml"
    tags:
      - "pos-desktop-v*"
  pull_request:
    paths:
      - "artifacts/pos-desktop/**"
      - ".github/workflows/pos-desktop-build.yml"
  workflow_dispatch:
    inputs:
      sign:
        description: "Force code-signing (requires WINDOWS_CERT_* secrets)"
        type: boolean
        default: false
      release:
        description: "Create a GitHub Release (only on tag pushes or manual)"
        type: boolean
        default: false

# Cancel in-progress runs on the same ref to save Windows-runner minutes.
concurrency:
  group: pos-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed for softprops/action-gh-release on tag pushes

jobs:
  build:
    name: Build (win-x64)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: artifacts/pos-desktop
        shell: bash

    env:
      # Use latest stable (needed for edition2024 in transitive deps like toml v1.1.2)
      RUST_VERSION: "stable"
      NODE_VERSION: "20"
      PNPM_VERSION: "9"
      # Tauri target — Cargo.toml + tauri.conf.json are pinned to win-x64
      TAURI_TARGET: "x86_64-pc-windows-msvc"

    steps:
      # ─── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ─── 2. Node toolchain (Vite frontend build) ────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ─── 2b. Pin version from the git tag (tag builds only) ──────────
      # The MSI ProductVersion + the in-app __APP_VERSION__ come from the
      # COMMITTED package.json / tauri.conf.json — NOT from the tag. If a
      # `pos-desktop-vX.Y.Z` tag is cut on a commit whose version files still
      # say something else, we ship an MSI that reports the WRONG version
      # (this already happened: tag pos-desktop-v0.8.12 had no bump commit).
      # Deriving the version FROM the tag here makes the build authoritative
      # so a release can never again advertise a version it didn't compile.
      - name: Pin version from tag
        if: startsWith(github.ref, 'refs/tags/pos-desktop-v')
        shell: bash
        run: |
          TAG_VER="${GITHUB_REF_NAME#pos-desktop-v}"
          if [[ -z "$TAG_VER" ]]; then
            echo "::error::Empty version after stripping tag prefix from $GITHUB_REF_NAME"; exit 1
          fi
          echo "Pinning version $TAG_VER from tag $GITHUB_REF_NAME"
          node -e "const fs=require('fs');const f='package.json';const j=JSON.parse(fs.readFileSync(f));j.version='$TAG_VER';fs.writeFileSync(f, JSON.stringify(j,null,2)+'\n');"
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(f));j.version='$TAG_VER';fs.writeFileSync(f, JSON.stringify(j,null,2)+'\n');"
          sed -i -E "0,/^version = \".*\"/s//version = \"$TAG_VER\"/" src-tauri/Cargo.toml
          echo "package.json    → $(node -p "require('./package.json').version")"
          echo "tauri.conf.json → $(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "Cargo.toml      → $(grep -m1 '^version' src-tauri/Cargo.toml)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-pos-desktop-${{ hashFiles('artifacts/pos-desktop/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-pos-desktop-

      - name: Install JS dependencies (pos-desktop only)
        run: pnpm install --no-frozen-lockfile

      # ─── 3. Rust toolchain (Tauri backend build) ────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.TAURI_TARGET }}
          components: rustfmt, clippy

      - name: Cache Cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: artifacts/pos-desktop/src-tauri -> target
          shared-key: pos-desktop-${{ env.RUST_VERSION }}

      # ─── 3b. SQLCipher build prerequisites (vendored OpenSSL) ────────
      # rusqlite's `bundled-sqlcipher-vendored-openssl` feature statically
      # links OpenSSL into the binary — no runtime DLLs need to be bundled
      # into the MSI. Building OpenSSL from source on Windows needs NASM
      # and Perl; both ship pre-installed on `windows-latest`. We verify
      # them here so a missing tool fails loudly instead of mid-cargo.
      - name: Install NASM + Strawberry Perl (vendored OpenSSL build deps)
        shell: pwsh
        run: |
          # NASM
          $nasm = (Get-Command nasm.exe -ErrorAction SilentlyContinue)
          if (-not $nasm) {
            Write-Host "NASM not on PATH, installing via choco..."
            choco install nasm -y --no-progress
            echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Host "NASM found at: $($nasm.Path)"
          }
          # Strawberry Perl — the perl that ships pre-installed on
          # windows-latest is Git-for-Windows' MSYS perl which is missing
          # core modules (FindBin, File::Compare, etc.) that OpenSSL's
          # Configure script requires. Force install of full Strawberry
          # Perl and prepend it to PATH so it wins over the Git Bash perl.
          Write-Host "Installing Strawberry Perl (required by openssl-sys vendored build)..."
          choco install strawberryperl -y --no-progress --force
          # Prepend strawberry perl bins to PATH so it wins over Git Bash perl
          echo "C:\Strawberry\c\bin"    | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Strawberry\perl\site\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # Verify in current step's env too
          $env:PATH = "C:\Strawberry\c\bin;C:\Strawberry\perl\site\bin;C:\Strawberry\perl\bin;$env:PATH"
          Write-Host "Perl version check:"
          perl -v | Select-String "This is perl"
          Write-Host "Perl which: $((Get-Command perl.exe).Path)"

      # ─── 4. WiX (MSI installer) ─────────────────────────────────────
      # Tauri 2.x uses WiX 3.x. windows-latest has it pre-installed, but we
      # ensure it's on PATH just in case.
      - name: Verify WiX availability
        shell: pwsh
        run: |
          $wix = (Get-Command candle.exe -ErrorAction SilentlyContinue)
          if (-not $wix) {
            Write-Host "::warning::WiX not on PATH — Tauri CLI will auto-download."
          } else {
            Write-Host "WiX found at: $($wix.Path)"
          }

      # ─── 5. Lint + typecheck (fail fast before the slow MSI build) ──
      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Cargo check (Rust)
        working-directory: artifacts/pos-desktop/src-tauri
        run: cargo check --target ${{ env.TAURI_TARGET }}

      - name: Cargo clippy (warnings allowed; errors fail)
        working-directory: artifacts/pos-desktop/src-tauri
        run: cargo clippy --target ${{ env.TAURI_TARGET }} --no-deps -- -D warnings
        continue-on-error: true   # Step 6 will tighten this once the source stabilises

      # ─── 6. Build Vite frontend ─────────────────────────────────────
      # VITE_OFFLINE_LICENSE_PUBLIC_KEY_B64 must be injected at build time —
      # standalone mode pins this Ed25519 public key into the bundle to
      # verify .zacolic.json license files offline (no cloud trust path).
      # Without it, StandaloneActivation shows the "غير مهيّأة" warning and
      # refuses any license file.
      - name: Verify offline-license public key secret is present
        shell: bash
        env:
          KEY: ${{ secrets.OFFLINE_LICENSE_PUBLIC_KEY_B64 }}
        run: |
          if [[ -z "$KEY" ]]; then
            echo "::error::OFFLINE_LICENSE_PUBLIC_KEY_B64 GitHub repository secret is empty or not set."
            echo "::error::Add it at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          echo "Key length : ${#KEY} chars"
          echo "Key prefix : ${KEY:0:24}..."
          echo "Key suffix : ...${KEY: -8}"

      - name: Build frontend (Vite)
        env:
          VITE_OFFLINE_LICENSE_PUBLIC_KEY_B64: ${{ secrets.OFFLINE_LICENSE_PUBLIC_KEY_B64 }}
        run: |
          echo "VITE_OFFLINE_LICENSE_PUBLIC_KEY_B64 length: ${#VITE_OFFLINE_LICENSE_PUBLIC_KEY_B64}"
          pnpm run build
          # Sanity-check: the pinned key MUST appear verbatim in the built bundle.
          if grep -rq "$VITE_OFFLINE_LICENSE_PUBLIC_KEY_B64" dist/ ; then
            echo "✅ Public key found in built bundle (dist/)"
          else
            echo "::error::Public key NOT found in built bundle — Vite did not inline it."
            exit 1
          fi

      # ─── 7. Build Tauri MSI ─────────────────────────────────────────
      # Code signing is OPT-IN — only attempts when all 3 cert secrets are
      # present (or `sign=true` was passed via workflow_dispatch).
      - name: Resolve signing mode
        id: signing
        shell: bash
        run: |
          if [[ -n "${{ secrets.WINDOWS_CERT_BASE64 }}" && \
                -n "${{ secrets.WINDOWS_CERT_PASSWORD }}" && \
                -n "${{ secrets.WINDOWS_CERT_THUMBPRINT }}" ]]; then
            echo "MODE=signed" >> "$GITHUB_OUTPUT"
            echo "::notice::Code-signing enabled (all 3 cert secrets present)"
          elif [[ "${{ inputs.sign }}" == "true" ]]; then
            echo "MODE=signed" >> "$GITHUB_OUTPUT"
            echo "::warning::sign=true requested but cert secrets missing — build will fail at sign step"
          else
            echo "MODE=unsigned" >> "$GITHUB_OUTPUT"
            echo "::notice::Unsigned build — Windows SmartScreen will warn end users"
          fi

      - name: Import signing certificate
        if: steps.signing.outputs.MODE == 'signed'
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PW:  ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:CERT_B64)
          $certPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, $bytes)
          $pw = ConvertTo-SecureString -String $env:CERT_PW -AsPlainText -Force
          Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $pw | Out-Null
          Remove-Item $certPath
          Write-Host "Certificate imported."

      - name: Build Tauri installers (unsigned)
        if: steps.signing.outputs.MODE == 'unsigned'
        run: |
          # Pass 1 — SMALL MSI (downloadBootstrapper from base tauri.conf.json):
          # served by the public /download page AND used by the in-app updater
          # (platform=win-x64). WebView2 is fetched at install time (and is
          # already present on any machine running this app, so updates need
          # no extra download).
          pnpm exec tauri build --target ${{ env.TAURI_TARGET }} --bundles msi
          # Pass 2 — LARGE OFFLINE one-click NSIS .exe: the offline config
          # override bundles the full WebView2 runtime so the protected
          # /install wizard (platform=win-x64-exe) installs with no internet.
          pnpm exec tauri build --target ${{ env.TAURI_TARGET }} --bundles nsis --config src-tauri/tauri.offline.conf.json

      - name: Build Tauri MSI (signed)
        if: steps.signing.outputs.MODE == 'signed'
        env:
          TAURI_SIGNING_PRIVATE_KEY:          ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI__BUNDLE__WINDOWS__CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          TAURI__BUNDLE__WINDOWS__DIGEST_ALGORITHM: "sha256"
          TAURI__BUNDLE__WINDOWS__TIMESTAMP_URL: "http://timestamp.digicert.com"
        run: |
          # Pass 1 — SMALL MSI (downloadBootstrapper) → /download + in-app updater
          pnpm exec tauri build --target ${{ env.TAURI_TARGET }} --bundles msi
          # Pass 2 — LARGE OFFLINE one-click NSIS .exe → /install wizard
          pnpm exec tauri build --target ${{ env.TAURI_TARGET }} --bundles nsis --config src-tauri/tauri.offline.conf.json

      # ─── 8. Locate + checksum the MSI ───────────────────────────────
      - name: Find produced MSI
        id: msi
        shell: bash
        run: |
          MSI_PATH=$(find src-tauri/target/${{ env.TAURI_TARGET }}/release/bundle/msi -name "*.msi" | head -n1)
          if [[ -z "$MSI_PATH" ]]; then
            echo "::error::No MSI produced — check Tauri build output above."
            exit 1
          fi
          MSI_NAME=$(basename "$MSI_PATH")
          MSI_SIZE=$(stat -c %s "$MSI_PATH" 2>/dev/null || stat -f %z "$MSI_PATH")
          MSI_SHA256=$(sha256sum "$MSI_PATH" | cut -d' ' -f1)
          echo "PATH=$MSI_PATH" >> "$GITHUB_OUTPUT"
          echo "NAME=$MSI_NAME" >> "$GITHUB_OUTPUT"
          echo "SIZE=$MSI_SIZE" >> "$GITHUB_OUTPUT"
          echo "SHA256=$MSI_SHA256" >> "$GITHUB_OUTPUT"
          echo ""
          echo "MSI: $MSI_NAME ($MSI_SIZE bytes)"
          echo "SHA256: $MSI_SHA256"

      # ─── 8b. Locate + checksum the NSIS one-click .exe ──────────────
      # NSIS produces a Chrome-style one-click installer (per-user, no admin)
      # used by the protected /install wizard (platform=win-x64-exe). The
      # public /download page keeps serving the .msi (platform=win-x64).
      - name: Find produced NSIS exe
        id: exe
        shell: bash
        run: |
          EXE_PATH=$(find src-tauri/target/${{ env.TAURI_TARGET }}/release/bundle/nsis -name "*-setup.exe" | head -n1)
          if [[ -z "$EXE_PATH" ]]; then
            EXE_PATH=$(find src-tauri/target/${{ env.TAURI_TARGET }}/release/bundle/nsis -name "*.exe" | head -n1)
          fi
          if [[ -z "$EXE_PATH" ]]; then
            echo "::error::No NSIS .exe produced — check Tauri build output above."
            exit 1
          fi
          EXE_NAME=$(basename "$EXE_PATH")
          EXE_SIZE=$(stat -c %s "$EXE_PATH" 2>/dev/null || stat -f %z "$EXE_PATH")
          EXE_SHA256=$(sha256sum "$EXE_PATH" | cut -d' ' -f1)
          echo "PATH=$EXE_PATH" >> "$GITHUB_OUTPUT"
          echo "NAME=$EXE_NAME" >> "$GITHUB_OUTPUT"
          echo "SIZE=$EXE_SIZE" >> "$GITHUB_OUTPUT"
          echo "SHA256=$EXE_SHA256" >> "$GITHUB_OUTPUT"
          echo ""
          echo "NSIS exe: $EXE_NAME ($EXE_SIZE bytes)"
          echo "SHA256: $EXE_SHA256"

      - name: Write build manifest
        shell: bash
        run: |
          cat > build-manifest.json <<EOF
          {
            "name": "${{ steps.msi.outputs.NAME }}",
            "sizeBytes": ${{ steps.msi.outputs.SIZE }},
            "sha256": "${{ steps.msi.outputs.SHA256 }}",
            "signed": ${{ steps.signing.outputs.MODE == 'signed' }},
            "target": "${{ env.TAURI_TARGET }}",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "buildAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat build-manifest.json

      # ─── 9. Upload artifact (always, even on PRs) ───────────────────
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-desktop-${{ github.sha }}-${{ steps.signing.outputs.MODE }}
          path: |
            artifacts/pos-desktop/${{ steps.msi.outputs.PATH }}
            artifacts/pos-desktop/${{ steps.exe.outputs.PATH }}
            artifacts/pos-desktop/build-manifest.json
          retention-days: 30
          if-no-files-found: error

      # ─── 10. Tag-driven GitHub Release ──────────────────────────────
      - name: Create GitHub Release (tag-only)
        if: startsWith(github.ref, 'refs/tags/pos-desktop-v') || inputs.release == true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/pos-desktop/${{ steps.msi.outputs.PATH }}
            artifacts/pos-desktop/${{ steps.exe.outputs.PATH }}
            artifacts/pos-desktop/build-manifest.json
          name: "ZACOD POS Desktop ${{ github.ref_name }}"
          draft: true
          generate_release_notes: true
          body: |
            ## ZACOD POS Desktop — `${{ github.ref_name }}`

            **MSI installer (`/download` page):** `${{ steps.msi.outputs.NAME }}`
            **Size:** ${{ steps.msi.outputs.SIZE }} bytes
            **SHA-256:** `${{ steps.msi.outputs.SHA256 }}`

            **One-click installer (`/install` wizard):** `${{ steps.exe.outputs.NAME }}`
            **Size:** ${{ steps.exe.outputs.SIZE }} bytes
            **SHA-256:** `${{ steps.exe.outputs.SHA256 }}`

            **Signed:** `${{ steps.signing.outputs.MODE }}`
            **Commit:** ${{ github.sha }}

            ### Next steps for SuperAdmin
            The server auto-mirrors BOTH assets hourly into the Releases table
            (`ALL` country): the `.msi` as platform `win-x64` and the `.exe` as
            platform `win-x64-exe`. To publish immediately, hit **SuperAdmin →
            POS Devices → Releases tab → مزامنة الآن**, or add per-country rows
            manually (use platform `win-x64` for `/download`, `win-x64-exe` for
            the `/install` one-click wizard).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─── 11. Job summary (visible in the Actions UI) ────────────────
      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ZACOD POS Desktop — build summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| MSI | \`${{ steps.msi.outputs.NAME || 'n/a' }}\` |"
            echo "| Size | ${{ steps.msi.outputs.SIZE || 'n/a' }} bytes |"
            echo "| SHA-256 | \`${{ steps.msi.outputs.SHA256 || 'n/a' }}\` |"
            echo "| Signed | ${{ steps.signing.outputs.MODE || 'n/a' }} |"
            echo "| Target | ${{ env.TAURI_TARGET }} |"
            echo "| Commit | ${{ github.sha }} |"
            echo "| Ref | ${{ github.ref }} |"
          } >> "$GITHUB_STEP_SUMMARY"
