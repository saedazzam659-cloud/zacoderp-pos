openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ZATCA Saudi e-invoicing API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: companies
    description: Company management
  - name: invoices
    description: Invoice management
  - name: customers
    description: Customer management
  - name: dashboard
    description: Dashboard & analytics
  - name: safety
    description: Occupational Safety & Health (OSH / ISO 45001)
  - name: security
    description: Central SuperAdmin security operations
  - name: journalEntries
    description: Manual accounting journal entries
  - name: school
    description: School enrollment history and academic-year promotion
  - name: crm
    description: CRM WhatsApp marketing contacts and campaigns
  - name: purchasing
    description: Purchase documents and receipt follow-up
  - name: inventory
    description: Inventory delivery documents
paths:
  /hr-portal/guardian/login:
    post:
      operationId: guardianPortalLogin
      tags: [school]
      summary: Sign a guardian into the ZacodeHR family portal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardianPortalLoginInput"
      responses:
        "200":
          description: Guardian portal session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianPortalLoginResult"
        "401":
          description: Invalid credentials or disabled school module
  /hr-portal/guardian/children:
    get:
      operationId: getGuardianPortalChildren
      tags: [school]
      summary: Read children linked to the signed-in guardian
      responses:
        "200":
          description: Children and school records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GuardianPortalChild"
        "401":
          description: Guardian session is invalid
        "403":
          description: School access is disabled or no longer linked
  /hr-portal/guardian/children/{studentId}/biometric-consent:
    post:
      operationId: setGuardianStudentBiometricConsent
      tags: [school]
      summary: Grant or revoke face-attendance consent for a linked child
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardianBiometricConsentInput"
      responses:
        "200":
          description: Consent state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianBiometricConsentResult"
        "401":
          description: Guardian session is invalid
        "403":
          description: Child is not linked to this guardian
        "404":
          description: Child was not found
  /school/portal/guardian-accounts:
    get:
      operationId: getSchoolGuardianPortalAccounts
      tags: [school]
      summary: List guardian portal accounts for the current company
      responses:
        "200":
          description: Guardian accounts without credential hashes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchoolGuardianPortalAccount"
        "403":
          description: School access or view permission is denied
    post:
      operationId: createSchoolGuardianPortalAccount
      tags: [school]
      summary: Create a guardian portal account and link guardian records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolGuardianPortalAccountInput"
      responses:
        "201":
          description: Guardian account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolGuardianPortalAccount"
        "400":
          description: Invalid account or guardian links
        "403":
          description: School create permission is denied
        "409":
          description: Username or guardian link is already in use
  /school/portal/guardian-accounts/{id}:
    patch:
      operationId: updateSchoolGuardianPortalAccount
      tags: [school]
      summary: Update guardian access, password, or linked guardian records
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolGuardianPortalAccountUpdate"
      responses:
        "200":
          description: Guardian account updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolGuardianPortalAccount"
        "400":
          description: Invalid account update
        "403":
          description: School edit permission is denied
        "404":
          description: Guardian account was not found
        "409":
          description: Username or guardian link is already in use
  /school/portal/face-enrollment-status:
    get:
      operationId: getSchoolStudentFaceEnrollmentStatus
      tags: [school]
      summary: List current guardian consent and encrypted face-enrollment status
      responses:
        "200":
          description: Student biometric status for the current company
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchoolStudentFaceEnrollmentStatus"
        "403":
          description: School access or view permission is denied
  /school/portal/students/{studentId}/face-enrollment:
    post:
      operationId: enrollSchoolStudentFace
      tags: [school]
      summary: Store an encrypted face descriptor when active guardian consent exists
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolStudentFaceEnrollmentInput"
      responses:
        "200":
          description: Student face enrollment saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolStudentFaceEnrollmentResult"
        "400":
          description: Descriptor or liveness check is invalid
        "403":
          description: School edit permission is denied or guardian consent is missing
        "404":
          description: Student was not found
    delete:
      operationId: removeSchoolStudentFaceEnrollment
      tags: [school]
      summary: Remove the student's encrypted face descriptor
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Student face enrollment removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolStudentFaceEnrollmentResult"
        "403":
          description: School edit permission is denied
        "404":
          description: Student or enrollment was not found
  /school/portal/face-attendance/recognize:
    post:
      operationId: recognizeSchoolStudentFace
      tags: [school]
      summary: Match a consented student and record one daily face attendance event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolStudentFaceRecognitionInput"
      responses:
        "200":
          description: Recognition and attendance outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolStudentFaceRecognitionResult"
        "400":
          description: Descriptor or liveness check is invalid
        "403":
          description: School attendance edit permission is denied
        "404":
          description: No enrolled student matched or no active enrollment exists
        "409":
          description: Daily arrival and departure have already been recorded
  /school/enrollments/promotion-plan:
    get:
      operationId: getSchoolEnrollmentPromotionPlan
      tags: [school]
      summary: Preview eligible student enrollments for transfer to another academic year
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: sourceYearId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: targetYearId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Source enrollments and student eligibility for the selected target year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolEnrollmentPromotionPlan"
        "400":
          description: Invalid or identical academic years
        "403":
          description: School access or view permission is denied
        "404":
          description: An academic year does not exist in the current company
        "413":
          description: Source year has more than 5000 enrollments
  /school/students/{studentId}/academic-history:
    get:
      operationId: getSchoolStudentAcademicHistory
      tags: [school]
      summary: Read a student's yearly enrollment, attendance, and exam-result history
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: companyId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Student history from the current company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolStudentAcademicHistory"
        "403":
          description: School access or view permission is denied
        "404":
          description: Student does not exist in the current company
  /school/enrollments/promote:
    post:
      operationId: promoteSchoolEnrollments
      tags: [school]
      summary: Create new target-year enrollments without changing source-year records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolEnrollmentPromotionInput"
      responses:
        "200":
          description: New enrollments created; existing target-year enrollments are skipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolEnrollmentPromotionResult"
        "400":
          description: Invalid source enrollments, target classes, or request values
        "403":
          description: School create permission is denied
        "404":
          description: An academic year or target class does not exist in the current company
        "409":
          description: Enrollment data changed during promotion; refresh the preview
  /school/academic-control/periods:
    get:
      operationId: getSchoolAcademicPeriods
      tags: [school]
      summary: List academic periods for one school year
      parameters:
        - name: academicYearId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Periods ordered for the selected school year
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SchoolAcademicPeriod" }
        "403": { description: School view permission is denied }
    post:
      operationId: createSchoolAcademicPeriod
      tags: [school]
      summary: Create an academic period
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolAcademicPeriodInput" }
      responses:
        "201":
          description: Academic period created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolAcademicPeriod" }
        "400": { description: Invalid dates or period values }
        "403": { description: School create permission is denied }
  /school/academic-control/periods/{periodId}:
    put:
      operationId: updateSchoolAcademicPeriod
      tags: [school]
      summary: Update an academic period
      parameters:
        - name: periodId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolAcademicPeriodUpdate" }
      responses:
        "200":
          description: Academic period updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolAcademicPeriod" }
        "400": { description: Invalid dates or period values }
        "403": { description: School edit permission is denied }
        "404": { description: Academic period not found }
    delete:
      operationId: deleteSchoolAcademicPeriod
      tags: [school]
      summary: Delete an unused academic period
      parameters:
        - name: periodId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Academic period deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolDeleteResult" }
        "403": { description: School delete permission is denied }
        "404": { description: Academic period not found }
        "409": { description: The period is used by exams or published results }
  /school/academic-control/offerings:
    get:
      operationId: getSchoolSubjectOfferings
      tags: [school]
      summary: List subjects assigned to classes for an academic year
      parameters:
        - name: academicYearId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: classId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Class subject assignments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SchoolSubjectOffering" }
        "403": { description: School view permission is denied }
    post:
      operationId: createSchoolSubjectOffering
      tags: [school]
      summary: Assign a subject and teacher to a class
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolSubjectOfferingInput" }
      responses:
        "201":
          description: Subject assignment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolSubjectOffering" }
        "400": { description: "Class, subject, or academic year mismatch" }
        "403": { description: School create permission is denied }
        "409": { description: The subject is already assigned to this class and year }
  /school/academic-control/offerings/{offeringId}:
    put:
      operationId: updateSchoolSubjectOffering
      tags: [school]
      summary: Update a class subject assignment
      parameters:
        - name: offeringId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolSubjectOfferingUpdate" }
      responses:
        "200":
          description: Subject assignment updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolSubjectOffering" }
        "400": { description: Invalid assignment values }
        "403": { description: School edit permission is denied }
        "404": { description: Subject assignment not found }
    delete:
      operationId: deleteSchoolSubjectOffering
      tags: [school]
      summary: Remove an unused class subject assignment
      parameters:
        - name: offeringId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Subject assignment deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolDeleteResult" }
        "403": { description: School delete permission is denied }
        "404": { description: Subject assignment not found }
        "409": { description: The assignment has academic records }
  /school/academic-control/policies:
    get:
      operationId: getSchoolGradeSubjectPolicies
      tags: [school]
      summary: List grade-specific grading policies
      parameters:
        - name: gradeId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Grading policies for the selected grade
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SchoolGradeSubjectPolicy" }
        "403": { description: School view permission is denied }
  /school/academic-control/policies/{subjectId}:
    put:
      operationId: saveSchoolGradeSubjectPolicy
      tags: [school]
      summary: Save the grading policy for a grade and subject
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolGradeSubjectPolicyInput" }
      responses:
        "200":
          description: Grading policy saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolGradeSubjectPolicy" }
        "400": { description: Invalid weights or grading thresholds }
        "403": { description: School edit permission is denied }
  /school/academic-control/gradebook:
    get:
      operationId: getSchoolGradebook
      tags: [school]
      summary: Read students, assessments, and scores for a class subject and period
      parameters:
        - name: academicYearId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: periodId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: classId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: subjectId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Gradebook with enrolled students and assessment marks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolGradebook" }
        "400": { description: Invalid gradebook scope }
        "403": { description: School view permission is denied }
    post:
      operationId: saveSchoolGradebookMarks
      tags: [school]
      summary: Save assessment marks for multiple enrolled students
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolGradebookMarksInput" }
      responses:
        "200":
          description: Assessment marks saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolSaveCountResult" }
        "400": { description: Invalid scores or students outside the assessment class }
        "403": { description: School edit permission is denied }
        "423": { description: Approved results are locked for non-administrators }
  /school/academic-control/daily-assessments:
    get:
      operationId: getSchoolDailyAssessments
      tags: [school]
      summary: Read daily evaluations for a class, subject, and date
      parameters:
        - name: academicYearId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: periodId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: classId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: subjectId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: assessmentDate
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Daily assessment records alongside existing attendance
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SchoolDailyAssessmentRow" }
        "400": { description: Invalid daily assessment scope }
        "403": { description: School view permission is denied }
    put:
      operationId: saveSchoolDailyAssessments
      tags: [school]
      summary: Save daily evaluations for enrolled students
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolDailyAssessmentBatchInput" }
      responses:
        "200":
          description: Daily evaluations saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolSaveCountResult" }
        "400": { description: Invalid assessment values or students outside the class }
        "403": { description: School edit permission is denied }
        "423": { description: Approved results are locked for non-administrators }
  /school/academic-control/approvals:
    get:
      operationId: getSchoolResultApprovals
      tags: [school]
      summary: List approved and reopened result snapshots
      parameters:
        - name: academicYearId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: classId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Result approval history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SchoolResultApproval" }
        "403": { description: School view permission is denied }
    post:
      operationId: approveSchoolResults
      tags: [school]
      summary: Calculate and approve a midyear or year-end result snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolResultApprovalInput" }
      responses:
        "201":
          description: Result snapshot approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolResultApproval" }
        "400": { description: Invalid approval scope or incomplete grading policy }
        "403": { description: School administrator permission is required }
        "409": { description: One or more students have incomplete component scores }
  /school/academic-control/approvals/{approvalId}/reopen:
    post:
      operationId: reopenSchoolResults
      tags: [school]
      summary: Reopen an approved result snapshot for an administrator-approved correction
      parameters:
        - name: approvalId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Approval marked as reopened and excluded from the guardian portal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolResultApproval" }
        "403": { description: School administrator permission is required }
        "404": { description: Approved result snapshot not found }
  /school/academic-control/reports:
    get:
      operationId: getSchoolAcademicReport
      tags: [school]
      summary: Read weekly, monthly, exam, term, or student progress reports
      parameters:
        - name: reportType
          in: query
          required: true
          schema:
            type: string
            enum: [weekly, monthly, monthly_exams, midyear, year_end, student_progress]
        - name: academicYearId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: periodId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: classId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: subjectId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: enrollmentId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Filtered academic report data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolAcademicReport" }
        "400": { description: Invalid report filters }
        "403": { description: School view permission is denied }
  /school/academic-control/audit:
    get:
      operationId: getSchoolGradeAudit
      tags: [school]
      summary: Read grade, assessment, policy, and approval changes
      parameters:
        - name: enrollmentId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: Academic audit history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SchoolGradeAuditEvent" }
        "403": { description: School view permission is denied }
  /journal-entries/{id}/reverse:
    post:
      operationId: reverseJournalEntry
      tags: [journalEntries]
      summary: Create a draft reversal of an eligible manually-created journal entry
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryReversalInput"
      responses:
        "201":
          description: Reversal draft created; the original entry is unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryReversalResult"
        "400": { description: Invalid date or entry is not eligible for reversal }
        "403": { description: Not authorized to access or reverse this entry }
        "404": { description: Original journal entry not found }
        "409": { description: A reversal already exists or the entry changed state }
        "423": { description: Reversal date is in a closed period }
  /inventory/reports/brand-options:
    get:
      operationId: getInventoryReportBrandOptions
      tags: [inventory]
      summary: List company brands and their linked inventory item IDs for report filters
      parameters:
        - name: companyId
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Brands linked to at least one company item
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryReportBrandOption"
        "401": { description: Authentication or company scope is required }
  /inventory/pos-item-groups:
    get:
      operationId: listPosItemGroups
      tags: [inventory]
      summary: List the company-specific item groups used as POS display tabs
      responses:
        "200":
          description: POS display groups with their uploaded image paths
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PosItemGroup" }
        "401": { description: Authentication or company scope is required }
    post:
      operationId: createPosItemGroup
      tags: [inventory]
      summary: Create a POS display group without changing the item's accounting category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PosItemGroupInput" }
      responses:
        "201":
          description: POS display group created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosItemGroup" }
        "400": { description: Invalid group data or image path }
        "409": { description: Duplicate code or group name }
  /inventory/pos-item-groups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    put:
      operationId: updatePosItemGroup
      tags: [inventory]
      summary: Update a POS display group
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PosItemGroupInput" }
      responses:
        "200":
          description: POS display group updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosItemGroup" }
        "400": { description: Invalid group data or image path }
