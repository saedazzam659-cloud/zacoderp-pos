          application/json:
            schema: { $ref: "#/components/schemas/WhatsAppCampaignRecipientUpdate" }
      responses:
        "200":
          description: Recipient delivery status updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppCampaignRecipient" }
        "404":
          description: Campaign recipient not found

  /cash-expenses/options:
    get:
      operationId: getCashExpenseOptions
      tags: [cash-expenses]
      summary: Get cashboxes and expense accounts available to the current mobile user
      responses:
        "200":
          description: Available references and the current user/representative
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashExpenseOptions" }
  /cash-expenses:
    get:
      operationId: getCashExpenses
      tags: [cash-expenses]
      summary: List cash expenses visible to the current mobile user
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [draft, posted, cancelled] }
      responses:
        "200":
          description: Visible expenses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashExpenseList" }
    post:
      operationId: createCashExpense
      tags: [cash-expenses]
      summary: Save a cash expense as a draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CashExpenseInput" }
      responses:
        "201":
          description: Draft cash expense created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashExpense" }
  /cash-expenses/report:
    get:
      operationId: getCashExpenseReport
      tags: [cash-expenses]
      summary: Summarize posted cash expenses in the current user's permitted scope
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Posted expense totals grouped by cashbox and expense account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashExpenseReport" }
  /cash-expenses/receipt-upload:
    post:
      operationId: uploadCashExpenseReceipt
      tags: [cash-expenses]
      summary: Store an optional receipt image in private object storage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CashExpenseReceiptUploadInput" }
      responses:
        "201":
          description: Private receipt image stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashExpenseReceiptUpload" }
    delete:
      operationId: deleteCashExpenseReceiptUpload
      tags: [cash-expenses]
      summary: Delete a staged private receipt that was not attached to an expense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CashExpenseReceiptDeleteInput" }
      responses:
        "200":
          description: Staged receipt deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashExpenseReceiptDelete" }
        "409":
          description: Receipt is already attached to an expense
  /cash-expenses/{id}:
    get:
      operationId: getCashExpense
      tags: [cash-expenses]
      summary: Get one cash expense after checking its scope
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Cash expense
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashExpense" }
        "404":
          description: Cash expense not found
    patch:
      operationId: updateCashExpense
      tags: [cash-expenses]
      summary: Edit a draft cash expense
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CashExpenseUpdate" }
      responses:
        "200":
          description: Updated draft cash expense
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashExpense" }
  /cash-expenses/{id}/post:
    post:
      operationId: postCashExpense
      tags: [cash-expenses]
      summary: Post a cash expense through the existing payment-voucher journal builder
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Posted cash expense with its linked journal entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashExpense" }
  /cash-expenses/{id}/cancel:
    post:
      operationId: cancelCashExpense
      tags: [cash-expenses]
      summary: Cancel a draft or unpost and cancel a posted cash expense through its source-document lifecycle
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Cancelled cash expense
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashExpense" }
  /cash-expenses/{id}/receipt:
    get:
      operationId: getCashExpenseReceipt
      tags: [cash-expenses]
      summary: Stream a receipt only after verifying expense and branch access
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Private receipt image
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "404":
          description: Expense or receipt not found
  /purchasing/source-documents/lookup:
    get:
      operationId: lookupPurchaseSourceDocument
      tags: [purchasing]
      summary: Find an eligible purchase order or posted goods receipt by document number
      parameters:
        - name: kind
          in: query
          required: true
          schema: { type: string, enum: [purchase-order, goods-receipt] }
        - name: docNumber
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: companyId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: branchId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Source document header and item lines
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseSourceDocument" }
        "400": { description: Invalid document number or source type }
        "404": { description: Eligible source document not found }
        "409": { description: More than one eligible document has this number }
  /purchasing/purchase-orders/receipt-options:
    get:
      operationId: getPurchaseOrderReceiptOptions
      tags: [purchasing]
      summary: List non-cancelled purchase orders that can be linked to goods receipts
      parameters:
        - name: companyId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: branchId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Tenant-scoped purchase-order options
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PurchaseOrderReceiptOption" }
        "403": { description: Purchase-order access is denied }
  /purchasing/reports/receipt-follow-up:
    get:
      operationId: getPurchaseReceiptFollowUp
      tags: [purchasing]
      summary: Read ordered, stock-effective received, and remaining quantities by purchase-order item
      parameters:
        - name: companyId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: branchId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Purchase-order receipt follow-up report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseReceiptFollowUpReport" }
        "403": { description: Purchasing report access is denied }
  /purchases-analytics/variant-net-by-item:
    get:
      operationId: getPurchaseVariantNetByItem
      tags: [purchasing]
      summary: Aggregate posted purchase invoices and returns by item, unit, and currency
      parameters:
        - name: companyId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: branchId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Posted purchase and return activity netted within each item's unit and currency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseVariantNetByItemResponse"
        "400":
          description: Invalid date range
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403": { description: Purchasing report access is denied }
  /purchases-analytics/variant-net-by-supplier:
    get:
      operationId: getPurchaseVariantNetBySupplier
      tags: [purchasing]
      summary: Aggregate posted purchase invoices and returns by supplier, item, unit, and currency
      parameters:
        - name: companyId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: branchId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Posted purchases and returns grouped by supplier, item, unit, and native currency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseVariantNetBySupplierResponse"
        "400":
          description: Invalid date range
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403": { description: Purchasing report access is denied }
  /purchases-analytics/returns-by-item:
    get:
      operationId: getPurchaseReturnsByItem
      tags: [purchasing]
      summary: Aggregate posted purchase returns by item for a date range and branch
      parameters:
        - name: companyId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: branchId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Posted return quantities and line values grouped by item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseReturnsByItemResponse"
        "400":
          description: Invalid date range
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403": { description: Purchasing report access is denied }
  /goods-deliveries/source-lookup:
    get:
      operationId: lookupSalesDeliverySourceDocument
      tags: [inventory]
      summary: Find an unlinked posted goods delivery by document number
      parameters:
        - name: docNumber
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: companyId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: branchId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Delivery header and item lines
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesDeliverySourceDocument" }
        "400": { description: Invalid document number }
        "404": { description: Eligible delivery not found }
        "409": { description: More than one eligible delivery has this number }
  /sales/sales-orders/source-lookup:
    get:
      operationId: lookupSalesOrderSourceDocument
      tags: [sales]
      summary: Find a confirmed, unconverted sales order by document number
      parameters:
        - name: docNumber
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: companyId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: branchId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Eligible sales-order header
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesOrderSourceDocument" }
        "400": { description: Invalid document number }
        "404": { description: Eligible sales order not found }
        "409": { description: More than one eligible order has this number }
  /sales/sales-orders/{id}/convert:
    post:
      operationId: convertSalesOrderToInvoice
      tags: [sales]
      summary: Create a sales-invoice draft from a confirmed sales order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Created sales invoice draft and linked order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesOrderConversionResult" }
        "400": { description: Order is not confirmed or was already converted }
        "404": { description: Sales order not found }
  /purchasing/purchase-orders/{id}/convert:
    post:
      operationId: convertPurchaseOrderToInvoice
      tags: [purchasing]
      summary: Create a purchase-invoice draft from a confirmed purchase order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Created purchase invoice draft and linked order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseInvoiceConversionResult" }
        "403": { description: Purchase-invoice create permission is denied }
        "404": { description: Purchase order not found }
        "409": { description: Order is not confirmed or was already converted }
  /goods-receipts/{id}/convert-to-invoice:
    post:
      operationId: convertGoodsReceiptToInvoice
      tags: [inventory]
      summary: Create a purchase-invoice draft from an unlinked posted goods receipt
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchaseInvoiceConversionInput" }
      responses:
        "201":
          description: Created purchase invoice draft and linked receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseInvoiceDraft" }
        "400": { description: Receipt is not posted or payment details are invalid }
        "404": { description: Receipt not found }
  /goods-deliveries/{id}/convert-to-invoice:
    post:
      operationId: convertGoodsDeliveryToSalesInvoice
      tags: [inventory]
      summary: Create a sales-invoice draft from an unlinked posted goods delivery
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalesInvoiceConversionInput" }
      responses:
        "201":
          description: Created sales invoice draft and linked delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesInvoiceDraft" }
        "400": { description: Delivery is not posted or payment details are invalid }
        "404": { description: Delivery not found }

components:
  schemas:
    WhatsAppContact:
      type: object
      required: [id, companyId, name, phone, normalizedPhone, notes, customerId, deletedAt, createdAt, updatedAt]
      properties:
        id: { type: integer }
        companyId: { type: integer }
        name: { type: string }
        phone: { type: string }
        normalizedPhone: { type: string }
        notes: { type: ["string", "null"] }
        customerId: { type: ["integer", "null"] }
        deletedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WhatsAppContactInput:
      type: object
      required: [companyId, name, phone]
      properties:
        companyId: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 160 }
        phone: { type: string, minLength: 7, maxLength: 32 }
        notes: { type: ["string", "null"], maxLength: 2000 }
    WhatsAppContactUpdate:
      type: object
      required: [companyId]
      properties:
        companyId: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 160 }
        phone: { type: string, minLength: 7, maxLength: 32 }
        notes: { type: ["string", "null"], maxLength: 2000 }
    WhatsAppContactsImportInput:
      type: object
      required: [companyId, contacts]
      properties:
        companyId: { type: integer, minimum: 1 }
        contacts:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/WhatsAppContactImportRow"
    WhatsAppContactImportRow:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, maxLength: 160 }
        phone: { type: string, maxLength: 32 }
        notes: { type: ["string", "null"], maxLength: 2000 }
    WhatsAppContactsImportResult:
      type: object
      required: [created, duplicates, revived, invalid]
      properties:
        created: { type: integer }
        duplicates: { type: integer }
        revived: { type: integer }
        invalid: { type: integer }
    WhatsAppContactConversionInput:
      type: object
      required: [companyId]
      properties:
        companyId: { type: integer, minimum: 1 }
    WhatsAppContactConversionResult:
      type: object
      required: [contact, customerId, created]
      properties:
        contact: { $ref: "#/components/schemas/WhatsAppContact" }
        customerId: { type: integer }
        created: { type: boolean }
    WhatsAppCampaign:
      type: object
      required: [id, companyId, name, message, createdAt, totalRecipients, sentCount, notSentCount]
      properties:
        id: { type: integer }
        companyId: { type: integer }
        name: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        totalRecipients: { type: integer }
        sentCount: { type: integer }
        notSentCount: { type: integer }
    WhatsAppCampaignInput:
      type: object
      required: [companyId, name, message, contactIds]
      properties:
        companyId: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 160 }
        message: { type: string, minLength: 1, maxLength: 4096 }
        contactIds:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: integer, minimum: 1 }
    WhatsAppCampaignRecipient:
      type: object
      required: [id, contactId, name, phone, status, sentAt, createdAt]
      properties:
        id: { type: integer }
        contactId: { type: ["integer", "null"] }
        name: { type: string }
        phone: { type: string }
        status: { type: string, enum: [sent, not_sent] }
        sentAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    WhatsAppCampaignDetail:
      type: object
      required: [id, companyId, name, message, createdAt, recipients]
      properties:
        id: { type: integer }
        companyId: { type: integer }
        name: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        recipients:
          type: array
          items: { $ref: "#/components/schemas/WhatsAppCampaignRecipient" }
    WhatsAppCampaignRecipientUpdate:
      type: object
      required: [companyId, status]
      properties:
        companyId: { type: integer, minimum: 1 }
        status: { type: string, enum: [sent, not_sent] }
    SchoolAcademicPeriod:
      type: object
      required: [id, academicYearId, name, periodType, startDate, endDate, sortOrder, isActive]
      properties:
        id: { type: integer }
        academicYearId: { type: integer }
        name: { type: string }
        periodType: { type: string, enum: [term, midyear, year_end] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        sortOrder: { type: integer }
        isActive: { type: boolean }
    SchoolAcademicPeriodInput:
      type: object
      required: [academicYearId, name, periodType, startDate, endDate]
      properties:
        academicYearId: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 100 }
        periodType: { type: string, enum: [term, midyear, year_end] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        sortOrder: { type: integer, minimum: 1, default: 1 }
    SchoolAcademicPeriodUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        periodType: { type: string, enum: [term, midyear, year_end] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        sortOrder: { type: integer, minimum: 1 }
        isActive: { type: boolean }
    SchoolDeleteResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, enum: [true] }
    SchoolSubjectOffering:
      type: object
      required: [id, academicYearId, classId, className, subjectId, subjectNameAr, teacherEmployeeId, teacherNameAr, isActive]
      properties:
        id: { type: integer }
        academicYearId: { type: integer }
        classId: { type: integer }
        className: { type: string }
        subjectId: { type: integer }
        subjectNameAr: { type: string }
        teacherEmployeeId: { type: ["integer", "null"] }
        teacherNameAr: { type: ["string", "null"] }
        isActive: { type: boolean }
        notes: { type: ["string", "null"] }
    SchoolSubjectOfferingInput:
      type: object
      required: [academicYearId, classId, subjectId]
      properties:
        academicYearId: { type: integer, minimum: 1 }
        classId: { type: integer, minimum: 1 }
        subjectId: { type: integer, minimum: 1 }
        teacherEmployeeId: { type: ["integer", "null"], minimum: 1 }
        isActive: { type: boolean, default: true }
        notes: { type: ["string", "null"], maxLength: 1000 }
    SchoolSubjectOfferingUpdate:
      type: object
      properties:
        teacherEmployeeId: { type: ["integer", "null"], minimum: 1 }
        isActive: { type: boolean }
        notes: { type: ["string", "null"], maxLength: 1000 }
    SchoolGradeSubjectPolicy:
      type: object
      required: [id, gradeId, subjectId, subjectType, maximumScore, minimumScore, passMarkPercent, secondRoundPercent, gradeBands, midyearWeights, yearEndWeights, showDailyAssessmentsToGuardians, isActive]
      properties:
        id: { type: integer }
        gradeId: { type: integer }
        subjectId: { type: integer }
        subjectType: { type: string }
        maximumScore: { type: number }
        minimumScore: { type: number }
        passMarkPercent: { type: number }
        secondRoundPercent: { type: number }
        gradeBands:
          type: array
          items:
            type: object
            required: [minimumPercent, label]
            properties:
              minimumPercent: { type: number, minimum: 0, maximum: 100 }
              label: { type: string, minLength: 1, maxLength: 60 }
        midyearWeights:
          type: object
          additionalProperties: { type: number, minimum: 0, maximum: 100 }
        yearEndWeights:
          type: object
          additionalProperties: { type: number, minimum: 0, maximum: 100 }
        showDailyAssessmentsToGuardians: { type: boolean }
        isActive: { type: boolean }
    SchoolGradeSubjectPolicyInput:
      type: object
      required: [gradeId, subjectType, maximumScore, minimumScore, passMarkPercent, secondRoundPercent, gradeBands, midyearWeights, yearEndWeights, showDailyAssessmentsToGuardians]
      properties:
        gradeId: { type: integer, minimum: 1 }
        subjectType: { type: string, minLength: 1, maxLength: 60 }
        maximumScore: { type: number, minimum: 0.01 }
        minimumScore: { type: number, minimum: 0 }
        passMarkPercent: { type: number, minimum: 0, maximum: 100 }
        secondRoundPercent: { type: number, minimum: 0, maximum: 100 }
        gradeBands:
          type: array
          items:
            type: object
            required: [minimumPercent, label]
            properties:
              minimumPercent: { type: number, minimum: 0, maximum: 100 }
              label: { type: string, minLength: 1, maxLength: 60 }
        midyearWeights:
          type: object
          additionalProperties: { type: number, minimum: 0, maximum: 100 }
        yearEndWeights:
          type: object
          additionalProperties: { type: number, minimum: 0, maximum: 100 }
        showDailyAssessmentsToGuardians: { type: boolean }
        isActive: { type: boolean, default: true }
    SchoolSaveCountResult:
      type: object
      required: [saved]
      properties:
        saved: { type: integer, minimum: 0 }
    SchoolGradebookMark:
      type: object
      required: [enrollmentId, resultId, examId, score, notes]
      properties:
        enrollmentId: { type: integer }
        resultId: { type: ["integer", "null"] }
        examId: { type: integer }
        score: { type: ["number", "null"] }
        notes: { type: ["string", "null"] }
