<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 88" width="320" height="88" role="img" aria-label="Zacode">
  <defs>
    <linearGradient id="zg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="zg-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Icon: rounded square badge with stylized Z + ascending growth line + ZATCA QR-dot accent -->
  <g transform="translate(8 12)">
    <rect width="64" height="64" rx="14" fill="url(#zg)"/>
    <rect width="64" height="32" rx="14" fill="url(#zg-shine)"/>
    <!-- Z stroke -->
    <path d="M 18 20 H 46 L 19 44 H 46"
          fill="none" stroke="#ffffff" stroke-width="5.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Ascending line accent (growth / chart) -->
    <path d="M 32 50 L 40 42 L 48 46 L 54 38"
          fill="none" stroke="#fbbf24" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- QR-style accent dot -->
    <circle cx="54" cy="14" r="4" fill="#fbbf24"/>
    <circle cx="54" cy="14" r="1.6" fill="#047857"/>
  </g>

  <!-- Wordmark "Zacode" -->
  <g transform="translate(88 0)" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="0" y="52" font-size="40" font-weight="800" fill="#0f172a" letter-spacing="-1.2">
      Zacode
    </text>
    <!-- Tagline -->
    <text x="2" y="74" font-size="11" font-weight="600" fill="#059669" letter-spacing="2.4">
      ZATCA · ERP · CLOUD
    </text>
  </g>
</svg>
