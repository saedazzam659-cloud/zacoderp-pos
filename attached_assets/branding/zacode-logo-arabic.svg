    <circle cx="54" cy="14" r="1.6" fill="#047857"/>
  </g>

  <!-- Arabic wordmark "زاكود" - right-aligned for RTL -->
  <g font-family="'Cairo','Tajawal','Segoe UI Arabic',sans-serif">
    <text x="232" y="50" text-anchor="end" font-size="42" font-weight="800" fill="#0f172a">
